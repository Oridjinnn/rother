name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      target:
        description: "Build target triple (empty = host)"
        required: false
        default: ""
      bundles:
        description: "Comma-separated bundles (appimage,deb,rpm,msi,dmg)"
        required: false
        default: ""

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runs-on: ubuntu-22.04
            platform: linux
          - name: macos
            runs-on: macos-latest
            platform: macos
          - name: windows
            runs-on: windows-latest
            platform: windows
    env:
      # Override target/bundles when triggered manually via workflow_dispatch.
      TAURI_BUILD_TARGET: ${{ github.event.inputs.target }}
      REQUESTED_BUNDLES: ${{ github.event.inputs.bundles }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libglib2.0-dev \
            libayatana-appindicator3-dev \
            libssl-dev \
            libpango1.0-dev \
            libcairo2-dev \
            gir1.2-gtk-3.0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare Node sidecar binary
        shell: bash
        run: bash .zscripts/setup-node-sidecar.sh

      - name: Build desktop bundles
        shell: bash
        run: |
          if [ -n "$REQUESTED_BUNDLES" ]; then
            npm run tauri build -- -b "$REQUESTED_BUNDLES"
          else
            npm run tauri build
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rother-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
          if-no-files-found: ignore